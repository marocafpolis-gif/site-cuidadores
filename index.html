<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Movimento e Longevidade</title>
  <meta name="description" content="Treinos de força acompanhados, com demonstrações em movimento de cada exercício e conteúdos baseados em fontes confiáveis.">
  <meta name="theme-color" content="#F6F1EB">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="pular" href="#conteudo-principal">Pular para o conteúdo</a>
  <header class="topo">
    <button class="voltar" type="button" hidden aria-label="Voltar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <a class="marca" href="#hoje">Movimento <span>e</span> Longevidade</a>
  </header>

  <main id="conteudo-principal" tabindex="-1">
    <p class="carregando">Carregando…</p>
  </main>

  <nav class="abas" aria-label="Seções">
    <a href="#hoje" data-aba="hoje">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      Hoje
    </a>
    <a href="#treinos" data-aba="treinos">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10v4M6 7v10M18 7v10M21 10v4M6 12h12"/></svg>
      Treinos
    </a>
    <a href="#evolucao" data-aba="evolucao">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h18M6 16l4-5 3 3 5-7"/></svg>
      Evolução
    </a>
    <a href="#mais" data-aba="mais">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>
      Mais
    </a>
  </nav>

  <dialog class="dialogo" id="dialogo-concluir">
    <form method="dialog" class="form-concluir">
      <h2>Treino concluído</h2>
      <p class="sutil">Como foi o esforço de hoje?</p>
      <fieldset class="esforco">
        <legend class="sr">Esforço de 1 a 5</legend>
        <label><input type="radio" name="percepcao" value="1"><span>1</span><small>Muito leve</small></label>
        <label><input type="radio" name="percepcao" value="2"><span>2</span><small>Leve</small></label>
        <label><input type="radio" name="percepcao" value="3" checked><span>3</span><small>Na medida</small></label>
        <label><input type="radio" name="percepcao" value="4"><span>4</span><small>Puxado</small></label>
        <label><input type="radio" name="percepcao" value="5"><span>5</span><small>Muito puxado</small></label>
      </fieldset>
      <label class="campo">
        <span>Algo que queira registrar? (opcional)</span>
        <textarea name="nota" rows="3" maxlength="500" placeholder="Ex.: senti o joelho no afundo"></textarea>
      </label>
      <div class="acoes">
        <button type="button" class="btn btn-sec" value="cancelar" data-fechar>Cancelar</button>
        <button type="submit" class="btn" value="salvar">Salvar</button>
      </div>
    </form>
  </dialog>

  <div class="aviso-flutuante" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
